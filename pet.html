<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级桌宠</title>
<style>
  * { margin: 0; padding: 0; user-select: none; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #eef3ff; /* 浅色背景，图片没加载出来也不会是空白 */
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    height: 100vh;
  }
  .tip {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; color: #667; font-size: 14px;
    pointer-events: none;
  }
  #pet {
    position: absolute;
    width: 180px;
    cursor: move;
    text-align: center;
  }
  #pet img {
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    background: #fff;
  }
  #pet .name {
    margin-top: 8px;
    font-size: 16px;
    color: #334;
  }
</style>
</head>
<body>
  <div class="tip">按住头像可拖动，单击头像弹出名字</div>

  <div id="pet">
    <img id="photo" src="images/pet.jpg" alt="同学照片"
         onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22><rect width=%22180%22 height=%22180%22 fill=%22%23dbe4ff%22/><text x=%2290%22 y=%2295%22 font-size=%2214%22 fill=%22%23556%22 text-anchor=%22middle%22>请放入同学照片</text></svg>';">
    <div class="name" id="nameLabel"></div>
  </div>

<script>
  // ====== 在这里改成同学真实名字 ======
  const petName = "张思琦";

  const pet = document.getElementById("pet");
  const photo = document.getElementById("photo");
  const nameLabel = document.getElementById("nameLabel");
  nameLabel.innerText = petName;

  let isDrag = false;
  let offsetX = 0, offsetY = 0;
  let moved = false;

  pet.addEventListener("mousedown", function (e) {
    isDrag = true;
    moved = false;
    offsetX = e.clientX - pet.offsetLeft;
    offsetY = e.clientY - pet.offsetTop;
  });

  document.addEventListener("mousemove", function (e) {
    if (isDrag) {
      moved = true;
      pet.style.left = (e.clientX - offsetX) + "px";
      pet.style.top  = (e.clientY - offsetY) + "px";
    }
  });

  document.addEventListener("mouseup", function () {
    isDrag = false;
  });

  pet.addEventListener("click", function () {
    if (!moved) {
      alert("这是：" + petName);
    }
  });
</script>
</body>
</html>
